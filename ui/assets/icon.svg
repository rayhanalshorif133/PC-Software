<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Hex/Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>
  
  <!-- Ambient Inner Glow Ring -->
  <rect x="44" y="44" width="424" height="424" rx="90" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Glowing Download Shield / Symbol -->
  <g filter="url(#neonGlow)">
    <!-- Speed Downward Chevron / Shield Shape -->
    <path d="M256 100 L380 210 H310 V310 H202 V210 H132 Z" fill="url(#primaryGrad)" />
    
    <!-- Modern Tech Lightning Accent Overlay -->
    <path d="M256 120 L220 230 H270 L240 330 L320 220 H265 Z" fill="#ffffff" opacity="0.9" filter="url(#softShadow)"/>
  </g>

  <!-- Bottom Fast Storage Tray / Speed Arc -->
  <g>
    <path d="M140 350 H180 L200 380 H312 L332 350 H372 C386 350 396 360 396 374 V400 C396 414 386 424 372 424 H140 C126 424 116 414 116 400 V374 C116 360 126 350 140 350 Z" 
          fill="url(#accentGrad)" opacity="0.95" />
    <line x1="220" y1="395" x2="292" y2="395" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Pro Badge Indicator -->
  <g transform="translate(340, 60)">
    <rect width="110" height="44" rx="12" fill="url(#primaryGrad)" filter="url(#softShadow)"/>
    <text x="55" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">PRO</text>
  </g>
</svg>

