name: Auto Sync Branches to Portal

on:
  create:
  delete:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate branches.json
        run: |
          # Fetch all remote branches
          git fetch --all --prune
          
          # List all remote branches, strip 'origin/', remove HEAD, main, and gh-pages
          BRANCHES=$(git branch -r | sed 's/origin\///' | tr -d ' ' | grep -v 'HEAD' | grep -v '^main$' | grep -v '^gh-pages$' | sort -u)
          
          # Convert list to JSON array
          echo "$BRANCHES" | jq -R -s -c 'split("\n")[:-1]' > branches.json
          
          echo "Generated branches.json:"
          cat branches.json

      - name: Commit and push branches.json to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout main
          git add branches.json
          
          if git diff --staged --quiet; then
            echo "No changes in branches.json"
          else
            git commit -m "chore: auto-update branches.json list [skip ci]"
            git push origin main
          fi

      - name: Sync changes to gh-pages branch
        run: |
          git checkout gh-pages || git checkout -b gh-pages
          git merge main --ff-only || (git checkout main -- . && git commit -m "sync: update gh-pages from main [skip ci]")
          git push origin gh-pages || true
